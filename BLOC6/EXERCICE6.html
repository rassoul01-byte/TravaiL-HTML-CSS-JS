<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Tâches — Dev Data P8</title>
   <script src="exercice6.js" ></script>
  <link rel="stylesheet" href="exercice6.css">

 
</head>
<body>

  <header>
    <h1>📋 Gestion de Tâches</h1>
    <span>Dev Data P8</span>
  </header>

  <div class="app">

    <!-- UTILISATEURS -->
    <div class="card">
      <div class="card-title">👥 Utilisateurs</div>
      <div class="form-row">
        <input type="text" id="input-user" placeholder="Nom de l'utilisateur...">
        <button class="btn btn-primary" onclick="ajouterUtilisateur()">+ Ajouter</button>
      </div>
      <div id="liste-utilisateurs">
        <div class="vide">Aucun utilisateur ajouté.</div>
      </div>
    </div>

    <!-- TÂCHES -->
    <div class="card">
      <div class="card-title">✅ Tâches</div>

      <div class="stats">
        <div class="stat-box">
          <div class="num" id="stat-total">0</div>
          <div class="label">Total</div>
        </div>
        <div class="stat-box">
          <div class="num" id="stat-terminees">0</div>
          <div class="label">Terminées</div>
        </div>
        <div class="stat-box">
          <div class="num" id="stat-restantes">0</div>
          <div class="label">Restantes</div>
        </div>
      </div>

      <div class="form-row">
        <input type="text" id="input-tache" placeholder="Nouvelle tâche...">
        <select id="select-user-tache">
          <option value="">-- Utilisateur --</option>
        </select>
        <button class="btn btn-primary" onclick="ajouterTache()">+ Ajouter</button>
      </div>

      <div class="filtre-row">
        <select id="filtre-user" onchange="afficherTaches()">
          <option value="">🔍 Toutes les tâches</option>
        </select>
      </div>

      <div id="liste-taches">
        <div class="vide">Aucune tâche ajoutée.</div>
      </div>
    </div>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <h3>✏️ Modifier l'utilisateur</h3>
      <input type="text" id="modal-input" placeholder="Nouveau nom...">
      <input type="hidden" id="modal-id">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="fermerModal()">Annuler</button>
        <button class="btn btn-save" onclick="sauvegarderModif()">Sauvegarder</button>
      </div>
    </div>
  </div>

  

</body>
</html>
